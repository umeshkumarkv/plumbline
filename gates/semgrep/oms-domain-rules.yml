# Plumbline Guardrails — domain gates for the Broker-Dealer OMS (CLAUDE.md §5, §6, §10, §13a).
# Rule ids are prefixed DOM-. Each maps to an entry in packs/domain-rules/rules.yaml.
rules:

  - id: DOM-MONEY-rounding-mode
    message: "Money must be scaled with setScale(2, RoundingMode.HALF_UP) (CLAUDE.md §13a). Found rounding mode $M."
    severity: ERROR
    languages: [java]
    paths: {exclude: ["**/src/test/**"]}
    patterns:
      - pattern-either:
          - pattern: $X.setScale($N, RoundingMode.$M)
          - pattern: $X.setScale($N, java.math.RoundingMode.$M)
          - pattern: $X.divide($Y, $N, RoundingMode.$M)
      - metavariable-regex:
          metavariable: $M
          regex: ^(DOWN|UP|FLOOR|CEILING|HALF_DOWN|UNNECESSARY)$
    metadata: {category: DOMAIN, pack_rule: R-MONEY-2, claude_md: "§13a"}

  - id: DOM-MONEY-deprecated-rounding
    message: "Deprecated BigDecimal.ROUND_* constant. Use RoundingMode.HALF_UP for money (CLAUDE.md §13a)."
    severity: ERROR
    languages: [java]
    paths: {exclude: ["**/src/test/**"]}
    pattern-either:
      - pattern: BigDecimal.ROUND_UP
      - pattern: BigDecimal.ROUND_DOWN
      - pattern: BigDecimal.ROUND_CEILING
      - pattern: BigDecimal.ROUND_FLOOR
      - pattern: BigDecimal.ROUND_HALF_DOWN
      - pattern: BigDecimal.ROUND_HALF_EVEN
      - pattern: BigDecimal.ROUND_HALF_UP
      - pattern: BigDecimal.ROUND_UNNECESSARY
    metadata: {category: DOMAIN, pack_rule: R-MONEY-2, claude_md: "§13a"}

  - id: DOM-MONEY-integer-cents
    message: "Monetary amount '$NAME' held as $T cents. Money is BigDecimal end to end (CLAUDE.md §10, §13a)."
    severity: ERROR
    languages: [java]
    paths: {exclude: ["**/src/test/**"]}
    patterns:
      - pattern-either:
          - pattern: $T $NAME;
          - pattern: $T $NAME = $V;
      - metavariable-regex:
          metavariable: $T
          regex: ^(long|Long|int|Integer)$
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(cents|pennies|minorunits|paise).*
    metadata: {category: DOMAIN, pack_rule: R-MONEY-1, claude_md: "§10"}

  - id: DOM-MONEY-double-division
    message: "Money converted through floating-point division. Use BigDecimal arithmetic (CLAUDE.md §13a)."
    severity: ERROR
    languages: [java]
    paths: {exclude: ["**/src/test/**"]}
    pattern-either:
      - pattern: BigDecimal.valueOf($X / 100.0)
      - pattern: new BigDecimal($X / 100.0)
      - pattern: BigDecimal.valueOf((double) $X / 100)
    metadata: {category: DOMAIN, pack_rule: R-MONEY-1, claude_md: "§13a"}

  - id: DOM-TIME-utc-trading-day
    message: "Trading-day / market-hours logic computed in UTC. Market time is America/New_York (CLAUDE.md §10)."
    severity: ERROR
    languages: [java]
    paths:
      include: ["**/order-service/**", "**/marketdata-service/**", "**/risk-service/**", "**/client-service/**"]
      exclude: ["**/src/test/**"]
    pattern-either:
      - pattern: LocalDate.now(ZoneOffset.UTC)
      - pattern: LocalDate.now(ZoneId.of("UTC"))
      - pattern: LocalTime.now(ZoneOffset.UTC)
      - pattern: LocalTime.now(ZoneId.of("UTC"))
      - pattern: LocalDateTime.now(ZoneOffset.UTC)
      - pattern: $D.atStartOfDay(ZoneOffset.UTC)
      - pattern: $I.atZone(ZoneOffset.UTC)
      - pattern: $I.atZone(ZoneId.of("UTC"))
      - pattern: ZonedDateTime.now(ZoneOffset.UTC)
      - pattern: LocalDate.now()
      - pattern: LocalTime.now()
    metadata: {category: DOMAIN, pack_rule: R-TIME-1, claude_md: "§10"}

  - id: DOM-PERF-unbounded-findall
    message: "Unbounded findAll() in $C loads a whole table per request. Use a paged/limited repository query (pack rule R-PERF-1)."
    severity: WARNING
    languages: [java]
    paths: {exclude: ["**/src/test/**"]}
    patterns:
      - pattern-either:
          - pattern-inside: |
              @Service
              class $C { ... }
          - pattern-inside: |
              @RestController
              class $C { ... }
      - pattern: $REPO.findAll()
    metadata: {category: DOMAIN, pack_rule: R-PERF-1}

  - id: DOM-QTY-non-positive-allowed
    message: "Quantity validation allows zero or negative values. quantity must be > 0 (CLAUDE.md §6 Level 1)."
    severity: ERROR
    languages: [java]
    paths: {exclude: ["**/src/test/**"]}
    pattern-either:
      - pattern: |
          @Min(0)
          $T $F;
      - pattern: |
          @PositiveOrZero
          $T $F;
      - pattern: |
          @Min(value = 0)
          $T $F;
    metadata: {category: DOMAIN, pack_rule: R-ORDER-2, claude_md: "§6"}

