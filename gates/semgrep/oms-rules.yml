# Plumbline Guardrails — deterministic gates for the Broker-Dealer OMS
# Each rule id is prefixed with the Plumbline code-review category (C1..C12) and cites CLAUDE.md.
# Scope: production code only (tests excluded via paths).
rules:

  # ───────── C1 Java type rules (CLAUDE.md §10, §13a) ─────────
  - id: C1-primary-key-not-uuid
    message: "Primary key '$F' is $T. Primary keys must be UUID (CLAUDE.md §13a)."
    severity: ERROR
    languages: [java]
    paths: {exclude: ["**/src/test/**"]}
    patterns:
      - pattern-either:
          - pattern: |
              @Id
              $T $F;
      - metavariable-regex:
          metavariable: $T
          regex: ^(Long|long|Integer|int|String)$
    metadata: {category: C1, claude_md: "§13a"}

  - id: C1-enum-ordinal
    message: "Enum persisted as ORDINAL (explicit or default). Use @Enumerated(EnumType.STRING) (CLAUDE.md §13a, §13f)."
    severity: ERROR
    languages: [java]
    paths: {exclude: ["**/src/test/**"]}
    pattern-either:
      - pattern: "@Enumerated(EnumType.ORDINAL)"
      - pattern: "@Enumerated(jakarta.persistence.EnumType.ORDINAL)"
      - pattern: |
          @Enumerated
          $T $F;
      - pattern: |
          @Enumerated()
          $T $F;
    metadata: {category: C1, claude_md: "§13a, §13f"}

  - id: C1-entity-primitive-boolean
    message: "Entity field '$F' uses primitive boolean. Use Boolean (CLAUDE.md §13a)."
    severity: WARNING
    languages: [java]
    paths: {exclude: ["**/src/test/**"]}
    patterns:
      - pattern-inside: |
          @Entity
          class $C { ... }
      - pattern: private boolean $F;
    metadata: {category: C1, claude_md: "§13a"}

  # ───────── C3 Lombok / C4 DI (CLAUDE.md §13d, §13e) ─────────
  - id: C3-entity-missing-lombok
    message: "Entity $C must carry @Data @Builder @NoArgsConstructor @AllArgsConstructor (CLAUDE.md §13d)."
    severity: WARNING
    languages: [java]
    paths: {exclude: ["**/src/test/**"]}
    patterns:
      - pattern: |
          @Entity
          class $C { ... }
      - pattern-not: |
          @Builder
          @NoArgsConstructor
          @AllArgsConstructor
          @Entity
          class $C { ... }
    metadata: {category: C3, claude_md: "§13d"}

  - id: C3-response-dto-mutable
    message: "Response DTO $C uses @Data/@Setter. Outbound responses must be immutable (@Value @Builder or a record) (CLAUDE.md §13d)."
    severity: WARNING
    languages: [java]
    paths: {include: ["**/dto/response/**"], exclude: ["**/src/test/**"]}
    patterns:
      - pattern-either:
          - pattern: |
              @Data
              class $C { ... }
          - pattern: |
              @Setter
              class $C { ... }
      - metavariable-regex:
          metavariable: $C
          regex: .*Response$
    metadata: {category: C3, claude_md: "§13d"}

  # ───────── C5 Architecture boundaries (CLAUDE.md §3, §10, §11) ─────────
  - id: C5-reactive-types
    message: "Reactive types (Reactor/WebFlux) are forbidden. Write blocking code on virtual threads (CLAUDE.md §10, §11)."
    severity: ERROR
    languages: [java]
    paths: {exclude: ["**/src/test/**"]}
    pattern-either:
      - pattern: import reactor.core.publisher.$X;
      - pattern: import org.springframework.web.reactive.$X;
      - pattern: import reactor.$X;
    metadata: {category: C5, claude_md: "§10, §11"}

  - id: C5-application-event
    message: "Spring ApplicationEvent is forbidden for cross-component messaging. Use Kafka (CLAUDE.md §10)."
    severity: ERROR
    languages: [java]
    paths: {exclude: ["**/src/test/**"]}
    pattern-either:
      - pattern: import org.springframework.context.ApplicationEventPublisher;
      - pattern: import org.springframework.context.ApplicationEvent;
      - pattern: (ApplicationEventPublisher $P).publishEvent(...)
    metadata: {category: C5, claude_md: "§10"}

  - id: C5-completable-future
    message: "CompletableFuture chains are forbidden. Block on virtual threads (CLAUDE.md §11)."
    severity: WARNING
    languages: [java]
    paths: {exclude: ["**/src/test/**"]}
    pattern-either:
      - pattern: CompletableFuture.supplyAsync(...)
      - pattern: CompletableFuture.runAsync(...)
      - pattern: $F.thenApply(...)
      - pattern: $F.thenCompose(...)
    metadata: {category: C5, claude_md: "§11"}

  - id: C5-pooled-http-client
    message: "Pooled HTTP client factory defeats virtual threads. Use SimpleClientHttpRequestFactory (CLAUDE.md §11)."
    severity: WARNING
    languages: [java]
    paths: {exclude: ["**/src/test/**"]}
    pattern-either:
      - pattern: new HttpComponentsClientHttpRequestFactory(...)
      - pattern: new PoolingHttpClientConnectionManager(...)
    metadata: {category: C5, claude_md: "§11"}

  - id: C6-api-path-version
    message: "REST path '$P' must start with /api/v1/ (CLAUDE.md §12)."
    severity: WARNING
    languages: [java]
    paths: {exclude: ["**/src/test/**"]}
    patterns:
      - pattern-inside: |
          @RestController
          class $C { ... }
      - pattern-either:
          - pattern: '@RequestMapping("$P")'
          - pattern: '@RequestMapping(value = "$P")'
          - pattern: '@RequestMapping(path = "$P")'
      - metavariable-regex:
          metavariable: $P
          regex: ^(?!/api/v1/).*
    metadata: {category: C6, claude_md: "§12"}

  # ───────── C7 Entity column conventions (CLAUDE.md §13f) ─────────
  - id: C7-money-column-precision
    message: "BigDecimal entity field '$F' needs @Column(precision = 19, scale = 4) (CLAUDE.md §13f)."
    severity: WARNING
    languages: [java]
    paths: {exclude: ["**/src/test/**"]}
    patterns:
      - pattern-inside: |
          @Entity
          class $C { ... }
      - pattern: private BigDecimal $F;
      - pattern-not: |
          @Column(..., precision = $P, ...)
          private BigDecimal $F;
    metadata: {category: C7, claude_md: "§13f"}

  # ───────── C8 Logging (CLAUDE.md §10, §13h) ─────────
  - id: C8-log-money-info
    message: "Monetary value logged at INFO or above. Log IDs and states only (CLAUDE.md §13h)."
    severity: WARNING
    languages: [java]
    paths: {exclude: ["**/src/test/**"]}
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: log.info(..., (BigDecimal $X), ...)
                  - pattern: log.warn(..., (BigDecimal $X), ...)
                  - pattern: log.error(..., (BigDecimal $X), ...)
              - metavariable-regex:
                  metavariable: $X
                  regex: (?i).*(price|amount|cash|balance|buyingpower|notional|ordervalue|marketvalue|cost|pnl|proceeds|commission|fee).*
          - patterns:
              - pattern-either:
                  - pattern: log.info(..., $O.$GET(), ...)
                  - pattern: log.warn(..., $O.$GET(), ...)
                  - pattern: log.error(..., $O.$GET(), ...)
              - metavariable-regex:
                  metavariable: $GET
                  regex: (?i)^get(price|limitprice|amount|cash|cashbalance|balance|buyingpower|notional|ordervalue|marketvalue|cost|avgcost|averagecost|pnl)$
    metadata: {category: C8, claude_md: "§13h"}

  - id: C9-generic-runtime-exception
    message: "Generic exception thrown from production code. Throw a domain exception with an errorCode (CLAUDE.md §13i)."
    severity: ERROR
    languages: [java]
    paths: {exclude: ["**/src/test/**"]}
    pattern-either:
      - pattern: throw new RuntimeException(...);
      - pattern: throw new Exception(...);
      - pattern: throw new IllegalStateException(...);
    metadata: {category: C9, claude_md: "§13i"}

  - id: C9-service-returns-null
    message: "Service method returns null. Return Optional or throw a domain exception (CLAUDE.md §13g)."
    severity: WARNING
    languages: [java]
    paths: {include: ["**/service/**"], exclude: ["**/src/test/**"]}
    patterns:
      - pattern-inside: |
          @Service
          class $C { ... }
      - pattern: return null;
      - pattern-not-inside: ($A, $B) -> { ... }
      - pattern-not-inside: ($A) -> { ... }
      - pattern-not-inside: () -> { ... }
    metadata: {category: C9, claude_md: "§13g"}

  # ───────── C11 Security (CLAUDE.md §10, §14) ─────────
