# Copy to .github/workflows/guardrails.yml in the OMS repo. Make the `gates` job a required status check, and require
# CODEOWNERS review on .github/, .claude/, CODEOWNERS and lint/test config (branch protection).
#
# Why pull_request_target: it runs THIS workflow as it exists on the base branch, so a PR cannot weaken the check by
# editing or deleting this file. Security: the PR head is checked out as DATA only — nothing from the PR is executed.
# The checks come from .agentic-sdlc/ as committed on the BASE branch (never the PR's copy), so a PR cannot change the
# checker that judges it. They only read files. First adoption: the PR that adds .agentic-sdlc/ is the bootstrap PR.
name: guardrails
on:
  pull_request_target:
    branches: [develop, main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head as data (no scripts from it are run)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pr
          persist-credentials: false
      - name: Check out the BASE branch — its .agentic-sdlc/ judges this PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install pinned Semgrep
        run: pip install -r base/.agentic-sdlc/requirements.txt
      - name: The PR may not touch the controls that judge it
        working-directory: pr
        env:
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PLUMBLINE_POLICY_PR: ${{ contains(github.event.pull_request.labels.*.name, 'plumbline-policy-change') && '1' || '0' }}
        run: |
          git fetch --no-tags origin ${{ github.event.pull_request.base.ref }}
          python3 ../base/.agentic-sdlc/gates/checks/protected_paths.py origin/${{ github.event.pull_request.base.ref }} HEAD
      - name: Deterministic gates (Semgrep + structure + domain), nosemgrep ignored
        # Large monorepo: add `--changed-from origin/<base>` to scan only the services this PR touches.
        run: python3 base/.agentic-sdlc/gates/run_gates.py pr --baseline base/.agentic-sdlc/gates/baseline.json
      - uses: actions/cache/restore@v4   # READ-ONLY: PR runs never write the cache (see impact-cache.yml)
        with:
          path: ~/.cache/plumbline-impact
          key: plumbline-impact-${{ github.event.pull_request.base.ref }}-${{ github.event.pull_request.base.sha }}
          restore-keys: plumbline-impact-${{ github.event.pull_request.base.ref }}-
      - name: Cross-service impact — fail if a counterpart is left pointing at something removed
        working-directory: pr
        run: |
          pip install "pyyaml==6.0.2"
          python3 ../base/.agentic-sdlc/impact/impact.py --repo . --base origin/${{ github.event.pull_request.base.ref }} \
            --cache ~/.cache/plumbline-impact --json ../impact.json --fail-on-breaking \
            --config ../base/.agentic-sdlc/project.yaml
      # ArchUnit runs inside the normal `mvn verify` once OmsArchitectureTest is added to each service.
