# CI for plumbline itself.
name: self-check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install "semgrep==1.180.0" pyyaml
      - name: Generated agent files are up to date with the canonical spec
        run: python3 loops/build.py --check
      - name: Every gate fires on its fixture and stays silent on clean code
        run: python3 selftest/run_selftest.py
      - name: Impact map gives known answers on its fixture (incl. git mode, cache, --fail-on-breaking)
        run: python3 selftest/impact_selftest.py
      - name: Every agent benchmark passes its good fixture and fails its bad one on exactly the planted checks
        run: python3 selftest/bench_selftest.py
      - name: Orchestrator/originator split — least-privilege agents, hand-offs, scope check
        run: python3 selftest/agents_selftest.py
      - name: Layout self-test (root app + ui, project.yaml)
        run: python3 selftest/layout_selftest.py
      - name: Init self-test (fixture shaped like a root Spring app + Angular ui)
        run: python3 selftest/init_selftest.py
      - name: Schemas and workflow templates parse
        run: |
          python3 -c "import json;json.load(open('packs/governance/audit-record.schema.json'))"
          python3 -c "import yaml;[yaml.safe_load(open(f)) for f in ['gates/ci/guardrails.yml','gates/ci/critic.yml','gates/ci/impact-cache.yml','packs/domain-rules/rules.yaml']]"
