# OMS Domain Rule Pack — Broker-Dealer (US equities, sell-side)
# Source of truth for what "correct" means beyond code style. Consumed by:
#   - the isolated critic (rubric "oms-domain") — every rule below is a rubric item
#   - deterministic gates where a rule is statically checkable (enforcement.gate)
#   - unit tests where a rule is executable (enforcement.test)
# Each rule cites the CLAUDE.md section it derives from. "eval" lists planted defects (eval/data) that violate it.
version: 1.0
domain: broker-dealer-oms
rules:

  # ── Money ───────────────────────────────────────────────────────────
  - id: R-MONEY-1
    statement: Monetary values are BigDecimal end to end. Never double/float, never integer cents, never converted through floating-point division.
    source: CLAUDE.md §10, §13a
    risk: Precision loss accumulates into cash, buying-power and P&L breaks.
    enforcement: {gate: [C1-money-floating-point, C1-bigdecimal-from-double, C1-bigdecimal-from-double-var, DOM-MONEY-integer-cents, DOM-MONEY-double-division], critic: true}
    eval: [D01, D02, P01]

  - id: R-MONEY-2
    statement: Money is scaled with setScale(2, RoundingMode.HALF_UP). The same rounding mode applies to debits and credits.
    source: CLAUDE.md §13a
    risk: Asymmetric or truncating rounding systematically favours one side (client or firm).
    enforcement: {gate: [DOM-MONEY-rounding-mode, DOM-MONEY-deprecated-rounding], critic: true}
    eval: [D45, P24]

  - id: R-MONEY-3
    statement: BigDecimal equality uses compareTo() == 0, never equals().
    source: CLAUDE.md §13a
    enforcement: {gate: [C1-bigdecimal-equals], critic: true}
    eval: [D03]

  - id: R-MONEY-4
    statement: Fill value is quantity-of-this-fill × fill price. Cash debits/credits are applied exactly once per execution id; holdings likewise.
    source: CLAUDE.md §7 (at-least-once delivery → idempotent consumers)
    risk: Double debits or over-credits on partial fills and redelivered events.
    enforcement: {critic: true, test: "client-service: replaying the same execution.completed event leaves cash and holdings unchanged"}
    eval: [D49]

  - id: R-MONEY-5
    statement: Buying power = settled cash − reserved cash for open BUY orders. Open SELL/SHORT_SELL orders never add buying power. Equity = cash + market value (never + unrealised P&L on top).
    source: CLAUDE.md §6 Level 2 #13; client-service CLAUDE.md
    risk: Sign or double-counting errors let clients trade beyond their means.
    enforcement: {critic: true}
    eval: [D48, P25, P27]

  # ── Order lifecycle ─────────────────────────────────────────────────
  - id: R-ORDER-1
    statement: Order state changes only along the CLAUDE.md §5 transitions, only inside OrderStateMachineService, and never out of a terminal state (RISK_REJECTED, FILLED, CANCELLED, REJECTED, EXPIRED). Each transition is persisted and publishes order.state.changed.
    source: CLAUDE.md §5; order-service CLAUDE.md §10
    risk: Backward or skipped transitions corrupt the audit trail and can re-open filled orders.
    enforcement: {gate: [DOM-SM-illegal-transition, DOM-SM-dynamic-target, DOM-SM-direct-setstatus, DOM-SM-transition-map], critic: true, test: packs/domain-rules/tests/OrderTransitionPolicyTest.java}
    eval: [D40, P21]

  - id: R-ORDER-2
    statement: Level 1 rejects quantity <= 0, LIMIT without limitPrice, MARKET with limitPrice, and symbols outside 1–6 uppercase letters — before anything is persisted or published.
    source: CLAUDE.md §6 Level 1
    enforcement: {gate: [DOM-QTY-non-positive-allowed], critic: true}
    eval: [D44]

  - id: R-ORDER-3
    statement: Level 2 checks run in the documented order and all must pass before persistence. Self-trade prevention applies to every order type, including MARKET orders.
    source: CLAUDE.md §6 Level 2 #12
    enforcement: {critic: true}
    eval: [D47, P26]

  # ── Risk ────────────────────────────────────────────────────────────
  - id: R-RISK-1
    statement: Nothing executes without an explicit RISK_CHECK_PASSED. Any risk result other than PASSED (null, ERROR, WARNED-without-policy, malformed) is not a pass.
    source: CLAUDE.md §10 ("NEVER execute a trade without RISK_CHECK_PASSED state")
    enforcement: {critic: true}
    eval: [D41, P22]

  - id: R-RISK-2
    statement: The risk engine fails closed. An exception inside a rule rejects (or holds) the order; it never skips the rule.
    source: CLAUDE.md §9
    enforcement: {critic: true}
    eval: [D46]

  - id: R-RISK-3
    statement: Risk thresholds use one unit convention per rule type (fractions for percentages), stated in the seed migration and the rule class.
    source: CLAUDE.md §9; risk-service CLAUDE.md §11
    enforcement: {critic: true}
    eval: [P30]

  # ── Time ────────────────────────────────────────────────────────────
  - id: R-TIME-1
    statement: Market hours, trading days, daily limits, DAY/GTC expiry and schedules use America/New_York. Instants are stored and serialised in UTC. Never compute a trading day from UTC or the JVM default zone.
    source: CLAUDE.md §10, §12; order-service CLAUDE.md §11
    risk: Market reported open/closed at the wrong times; daily limits reset at 19:00/20:00 ET.
    enforcement: {gate: [DOM-TIME-utc-trading-day], critic: true}
    eval: [D42, D43, P23]

  # ── Boundaries & messaging ─────────────────────────────────────────
  - id: R-BOUNDARY-1
    statement: A service reads and writes only its own schema. Cross-service data goes via REST (with circuit breaker) or Kafka.
    source: CLAUDE.md §3
    enforcement: {gate: [C12-flyway-foreign-schema, DOM-BOUNDARY-foreign-schema-sql], critic: true}
    eval: [D22, D50, P28]

  - id: R-KAFKA-1
    statement: Events for one order are keyed by orderId so all events of an order stay on one partition and in order. Consumers are idempotent (check current state; ignore if already applied).
    source: CLAUDE.md §7
    enforcement: {gate: [C2-kafka-group-name], critic: true}
    eval: [D23, P29]

  # ── Gaps found by the eval (not stated in CLAUDE.md before) ──────────
  - id: R-PERF-1
    statement: Request-path code never loads an unbounded table (findAll() + in-memory sort/filter). Use paged or limited repository queries. Reference data (instruments) may be cached instead.
    source: Added 2026-10-13 after eval D33 — the critic correctly noted CLAUDE.md had no such rule.
    enforcement: {gate: [DOM-PERF-unbounded-findall], critic: true}
    eval: [D33]

  - id: R-TEST-1
    statement: A change that adds a constructor dependency or changes a method signature updates the existing unit tests in the same PR (mocks/stubs), so the suite still compiles and passes.
    source: CLAUDE.md §15; added after eval controls Q03/Q08 broke existing tests
    enforcement: {gate: [C10-service-test-missing], critic: true, ci: "mvn test"}
    eval: [Q03, Q08]

# Known ambiguities in CLAUDE.md to resolve with the architect (do not "fix" in code):
ambiguities:
  - "§5 lists VALIDATED → RISK_REJECTED, but the code moves NEW → RISK_REJECTED (risk runs while the order is NEW). The gate accepts both until §5 is reconciled."
  - "§5 says CANCELLED is 'system expiry only' while EXPIRED is the DAY/GTC expiry state; two terminal states for one cause."
  - "PARTIALLY_FILLED → PARTIALLY_FILLED (further partial fills) is not listed in §5 but is required by the execution flow; the gate accepts it as an approved exception."
  - "MarketCloseScheduler sets EXPIRED via setStatus() outside the state machine (recorded as baseline debt): confirm it publishes order.state.changed."
